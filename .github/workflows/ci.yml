name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + policy baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install
        run: pip install -r server/requirements.txt pytest pytest-cov httpx

      - name: Test
        run: >-
          pytest tests -q
          --cov=server --cov=models --cov-report=term-missing
          --cov-fail-under=70

      - name: Policy baseline
        run: python benchmarks/policy_baseline.py --json policy-baseline.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-baseline
          path: policy-baseline.json

  live:
    name: Live server stress test (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inbox-arena:ci .

      - name: Start server
        run: |
          docker run -d --name arena -p 7860:7860 inbox-arena:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:7860/health && exit 0
            sleep 2
          done
          docker logs arena
          exit 1

      - name: Stress test against the running container
        run: |
          pip install httpx
          python scripts/stress_test.py http://localhost:7860

      - name: Server logs on failure
        if: failure()
        run: docker logs arena
